## IDF Component Manager Manifest File
##
## Two supported boards:
##   wzkj/esp32-s3-ai-xiaowei_low    (ESP32-S3, native Wi-Fi)
##   wzkj/esp32-p4-ai-xiaowei_plus   (ESP32-P4 + ESP32-C61 co-processor over SDIO)
## Every entry below is a *direct* dependency reached by surviving code under main/.
## Components pulled in transitively (cJSON, esp-dsp, esp_emote_gfx, ...) are resolved
## automatically and are intentionally not listed.
##
## Anything board-specific is gated by `rules:` on the target so that building one
## board never pulls in the other board's stack.

dependencies:
  ## --- core runtime -------------------------------------------------------
  # Network abstraction layer (NetworkInterface / http / mqtt / udp) used by
  # boards/common/board.h and wifi_board.cc. Not 4G-specific.
  78/esp-ml307: ~3.6.6
  78/esp-wifi-connect: ~3.2.2

  ## --- wireless co-processor (ESP32-P4 only) ------------------------------
  # The P4 has no native Wi-Fi/BT: the on-board ESP32-C61 (U14) provides both,
  # reached over SDIO. esp_hosted is the host side of that link; esp_wifi_remote
  # makes the standard esp_wifi_* API that WifiManager (78/esp-wifi-connect) calls
  # be forwarded to the co-processor instead of a local radio. Because of
  # esp_wifi_remote, WifiBoard/WifiManager need no board-specific network code.
  #
  # Gated on target: an ESP32-S3 build never sees either component.
  espressif/esp_hosted:
    # Pinned exactly: this is the host side of an RPC protocol that must match
    # the slave firmware already flashed into the C61 (also 2.12.11). A floating
    # ^2.12.11 could resolve to a newer host than the slave and break the link.
    version: "==2.12.11"
    rules:
      - if: target in [esp32p4]
  espressif/esp_wifi_remote:
    version: ^1.6.2
    rules:
      - if: target in [esp32p4]

  # Wake word / AFE front-end + audio pipeline
  espressif/esp-sr: ~2.4.7
  espressif/esp_audio_codec: ~2.5.0
  espressif/esp_audio_effects: ~1.3.0
  espressif/esp_codec_dev: ~1.5.6

  # Fonts and on-device assets
  78/xiaozhi-fonts: ~2.0.0
  espressif/esp_image_effects: ^1.0.1
  espressif/esp_new_jpeg: ^1.0.2

  ## --- display ------------------------------------------------------------
  lvgl/lvgl: ~9.5.0
  esp_lvgl_port: ~2.8.0
  espressif/esp_lcd_st77916: ^2.0.2
  # CO5300 466x466 AMOLED，跑在 MIPI-DSI 上（J4），只有 P4 板有这块屏。
  # 版本对齐板级参考实现 plus/lcd 实机验证过的 2.2.0：用 ~ 只吃补丁更新。
  espressif/esp_lcd_co5300:
    version: ~2.2.0
    rules:
      - if: target in [esp32p4]
  espressif2022/esp_emote_expression: ^1.0.2

  ## --- input --------------------------------------------------------------
  espressif/button: ~4.2.0

  ## Required IDF version
  idf:
    version: '>=5.5.2'
